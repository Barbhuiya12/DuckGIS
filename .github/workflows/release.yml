name: Release QGIS Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Tests
        run: |
          python -m unittest discover tests

      - name: Package Plugin Archive
        run: |
          mkdir -p build/DuckGIS
          cp -r __init__.py duckgis_plugin.py duckdb_engine.py layer_bridge.py metadata.txt requirements.txt LICENSE README.md build/DuckGIS/
          cp -r ui presets resources build/DuckGIS/
          cd build
          zip -r DuckGIS.zip DuckGIS
          echo "Package created at build/DuckGIS.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/DuckGIS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
